<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Twitch Voice Reader — Overlay</title>
<style>
  html, body {
    margin: 0; padding: 0; background: transparent;
    font-family: 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
  }
  #card {
    position: fixed;
    bottom: 40px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    opacity: 0;
    transition: opacity 220ms ease, transform 220ms ease;
    background: rgba(20, 16, 32, 0.85);
    border: 2px solid #9147ff;
    border-radius: 16px;
    padding: 14px 22px;
    display: flex; align-items: center; gap: 14px;
    max-width: 640px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  #card.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
  #avatar { width: 42px; height: 42px; border-radius: 50%; background: #9147ff33; flex-shrink: 0; }
  #username { color: #b794ff; font-weight: 700; font-size: 15px; }
  #text { color: #f4f0ff; font-size: 17px; line-height: 1.3; }
  #mic { width: 10px; height: 10px; border-radius: 50%; background: #43e97b; flex-shrink: 0;
         box-shadow: 0 0 8px #43e97b; animation: pulse 1s infinite ease-in-out; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.5); } }
</style>
</head>
<body>
  <div id="card">
    <div id="mic"></div>
    <div id="avatar"></div>
    <div>
      <div id="username"></div>
      <div id="text"></div>
    </div>
  </div>

<script>
  const card = document.getElementById('card');
  const usernameEl = document.getElementById('username');
  const textEl = document.getElementById('text');
  let hideTimeout = null;

  function connect() {
    const ws = new WebSocket(`ws://${location.host}/overlay/ws`);
    ws.onmessage = (evt) => {
      const data = JSON.parse(evt.data);
      if (data.type === 'Started') {
        usernameEl.textContent = data.display_name;
        textEl.textContent = data.text;
        card.classList.add('visible');
        clearTimeout(hideTimeout);
      } else if (data.type === 'Finished') {
        hideTimeout = setTimeout(() => card.classList.remove('visible'), 600);
      }
    };
    ws.onclose = () => setTimeout(connect, 2000); // reconnexion auto si OBS recharge la source
  }
  connect();
</script>
</body>
</html>
